services:
    php-fpm:
        build: php-fpm
        volumes:
            - ./app:/var/www/html/
        links:
            - db
    nginx:
        build: nginx
        ports:
            - 8080:80
        volumes:
            - ./app:/var/www/html/
        links:
            - php-fpm
    db:
        image: mysql
        ports:
            - 127.0.0.1:3306:3306
        environment:
            MYSQL_DATABASE: mydb
            MYSQL_USER: dev
            MYSQL_PASSWORD: 123123
            MYSQL_ROOT_PASSWORD: 123123
